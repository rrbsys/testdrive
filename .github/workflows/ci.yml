name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only — no plugin backends needed)
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy testdrive/

      - name: pytest
        run: pytest -v

  core-only-smoke-test:
    name: core framework works with only Pillow installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately install *just* the base package (Pillow only, no
      # plugin extras, no [dev]) to catch any accidental hard dependency
      # on torch/transformers/etc. creeping into core framework code.
      - name: Install core package only
        run: pip install -e .

      - name: -L / -I / -M all work with only Pillow installed
        run: |
          python -m testdrive -L
          python -m testdrive -I
          python -m testdrive -M '*'
