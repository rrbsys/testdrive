[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testdrive"
version = "0.1.2"
description = "One CLI. Many vision foundation models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "testdrive contributors" },
]
keywords = ["computer-vision", "object-detection", "cli", "foundation-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "Pillow>=10.0",  # currently the only requirement for cli/framework
    # put the following very general restrictions somewhere if you know a better place...
    "Numpy~=1.0; python_version=='3.11'",  # lots of 3.11 modules can't live with numpy 2.x
    "Torch<2.5; sys_platform=='win32'",    # uncomment for wine11 on mac only
]

[project.optional-dependencies]
# transformers is pinned exactly (not just a lower bound) because
# versions after 4.50.3 introduced a regression that pulls in a
# TensorFlow dependency chain, which in turn breaks every plugin here
# (confirmed by hand; see requirements.txt). Revisit this pin once
# that's fixed upstream.
groundingdino = ["torch>=2.2", "transformers==4.50.3"]
owlv2         = ["torch>=2.2", "transformers==4.50.3", "scipy"]
owlvit        = ["torch>=2.2", "transformers==4.50.3"]
florence2     = ["torch>=2.2", "transformers==4.50.3", "einops", "timm"]
samgd         = ["torch>=2.2", "transformers==4.50.3", "numpy", "segment-anything"]
# Note: the "segment-anything" PyPI package is an unofficial third-party
# mirror (Meta doesn't publish SAM to PyPI themselves — their own
# instructions are `pip install git+https://github.com/facebookresearch/segment-anything.git`).
# It exposes the same `from segment_anything import ...` API we use and
# works fine, but if you want the authoritative source, install that git
# URL yourself instead before installing this extra.
# yolo11 doesn't use transformers at all, so it's unaffected by the pin
# above — just torch + ultralytics.
yolo11        = ["torch>=2.2", "ultralytics>=8.3"]
# Every active plugin's dependencies at once.
all = ["testdrive[groundingdino,owlv2,owlvit,florence2,samgd,yolo11]"]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
testdrive = "testdrive.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["testdrive*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
# See typestubs/numpy/__init__.pyi for why this is here: it shadows
# numpy's own bundled stub (which recent releases ship using PEP 695
# syntax mypy can't parse under python_version = "3.10" — a hard parse
# error that a mere [[tool.mypy.overrides]] entry can't prevent, since
# it happens before per-module settings get a chance to apply).
mypy_path = "$MYPY_CONFIG_FILE_DIR/typestubs"

# None of these ship type stubs (or a py.typed marker) for mypy to find.
# That's a fact about the libraries, not something this project can fix
# by writing better code — silence the specific "can't find stub" noise
# here rather than sprinkling `# type: ignore[import-not-found]` at every
# call site. Strict mode still applies to everything *we* write; these
# imports just get treated as returning Any, same as any other untyped
# third-party dependency would under `strict`.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
    "segment_anything.*",
    "einops.*",
    "timm.*",
    "ultralytics.*",
]
ignore_missing_imports = true

# The shadow stub at typestubs/numpy/__init__.pyi (see mypy_path above
# and that file's own docstring) handles a bare `import numpy`, but
# numpy also has internal submodules (e.g. numpy._typing, pulled in
# transitively by other packages' own stubs) that aren't covered by
# that single stub file, and which mypy would otherwise still resolve
# from the real installed numpy. Some of those are regular .py source
# using PEP 695 syntax too (not just numpy's __init__.pyi) — and unlike
# that case, follow_imports = "skip" *does* apply here, since (per
# mypy's own docs) it only affects .py source files, never .pyi stubs,
# which is exactly why it didn't stop the __init__.pyi crash on its own
# before the shadow stub existed.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
