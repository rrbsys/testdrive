[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testdrive"
version = "0.1.3"
description = "One CLI. Many vision foundation models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "testdrive contributors" },
]
keywords = ["computer-vision", "object-detection", "cli", "foundation-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "Pillow>=10.0",  # currently the only requirement for cli/framework
    "certifi>=2024.0",  # CA bundle for download_file() on hosts with incomplete system trust stores (e.g. Win 8.1)
    # put the following very general restrictions somewhere if you know a better place...
    "Numpy~=1.0; python_version=='3.11'",  # lots of 3.11 modules can't live with numpy 2.x
    # "Torch<2.5; sys_platform=='win32'",    # uncomment for wine11 on mac only
]

[project.optional-dependencies]
# Every plugin's actual dependencies (with real version pins) now live
# in its own PLUGIN["requirements"]/["pip_options"]/["patches"] — see
# PluginManifest in detection.py and pyenv.run_pip_install. There's
# deliberately no "someplugin = [...]" / "all = [...]" extras here
# anymore: testdrive provisions a plugin's environment itself now
# (`testdrive -T <plugin>`, or `-T '*'` for every plugin at once — see
# README's Installation section), whether that's a dedicated pyenv (see
# worker_pool._provision_plugin_env) or, for the default "framework"
# pyenv most plugins share, installing straight into the environment
# already running testdrive (see selftest.py). A hand-written pip
# extras group can't express any of that per-plugin machinery (a
# pip_options flag like seem's --no-build-isolation, or its ordered
# source patch — see seem.py) — it was never anything more than a
# hand-maintained mirror of what's now the single source of truth.
dev = [
    "pytest>=7.0", 
    "ruff>=0.4,<0.16",
    "mypy>=1.8",
    "numpy",  # for CI
]

[project.scripts]
testdrive = "testdrive.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["testdrive*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
# See typestubs/numpy/__init__.pyi for why this is here: it shadows
# numpy's own bundled stub (which recent releases ship using PEP 695
# syntax mypy can't parse under python_version = "3.10" — a hard parse
# error that a mere [[tool.mypy.overrides]] entry can't prevent, since
# it happens before per-module settings get a chance to apply).
mypy_path = "$MYPY_CONFIG_FILE_DIR/typestubs"

# None of these ship type stubs (or a py.typed marker) for mypy to find.
# That's a fact about the libraries, not something this project can fix
# by writing better code — silence the specific "can't find stub" noise
# here rather than sprinkling `# type: ignore[import-not-found]` at every
# call site. Strict mode still applies to everything *we* write; these
# imports just get treated as returning Any, same as any other untyped
# third-party dependency would under `strict`.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
    "segment_anything.*",
    "einops.*",
    "timm.*",
    "ultralytics.*",
    "torchvision.*",
    "cv2",
]
ignore_missing_imports = true

# The shadow stub at typestubs/numpy/__init__.pyi (see mypy_path above
# and that file's own docstring) handles a bare `import numpy`, but
# numpy also has internal submodules (e.g. numpy._typing, pulled in
# transitively by other packages' own stubs) that aren't covered by
# that single stub file, and which mypy would otherwise still resolve
# from the real installed numpy. Some of those are regular .py source
# using PEP 695 syntax too (not just numpy's __init__.pyi) — and unlike
# that case, follow_imports = "skip" *does* apply here, since (per
# mypy's own docs) it only affects .py source files, never .pyi stubs,
# which is exactly why it didn't stop the __init__.pyi crash on its own
# before the shadow stub existed.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
